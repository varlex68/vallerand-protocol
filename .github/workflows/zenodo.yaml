name: Release to Zenodo

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-to-zenodo:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Zenodo token
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ERROR: missing ZENODO_TOKEN"
            exit 1
          fi

      - name: Create archive
        run: |
          mkdir -p dist
          tar --exclude=.git \
              --exclude=.github \
              --exclude=.venv \
              --exclude=dist \
              --exclude=__pycache__ \
              --exclude=.pytest_cache \
              --exclude=.mypy_cache \
              --exclude=.ruff_cache \
              -czf dist/vallerand-protocol.tar.gz .

      - name: Create Zenodo deposition
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          with open('.zenodo.json', 'r', encoding='utf-8') as f:
              metadata = json.load(f)
          payload = json.dumps({"metadata": metadata}).encode('utf-8')
          req = urllib.request.Request(
              'https://zenodo.org/api/deposit/depositions',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': f"Bearer {os.environ['ZENODO_TOKEN']}"
              },
              method='POST'
          )
          with urllib.request.urlopen(req) as response:
              body = json.loads(response.read().decode('utf-8'))
          print(body['id'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"ZENODO_DEPOSITION_ID={body['id']}\n")
          PY

      - name: Upload archive
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            -F "file=@dist/vallerand-protocol.tar.gz" \
            "https://zenodo.org/api/deposit/depositions/${ZENODO_DEPOSITION_ID}/files"

      - name: Publish deposition
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            "https://zenodo.org/api/deposit/depositions/${ZENODO_DEPOSITION_ID}/actions/publish"
